<script>
// Terapkan pilihan tema tersimpan SEBELUM CSS digambar, supaya tidak ada
// kedipan warna terang sesaat sebelum berpindah ke gelap (atau sebaliknya).
(function() {
  try {
    var saved = localStorage.getItem('simprodi_theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
})();
</script>
